<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบตัวชี้วัด ER หนองวัวซอ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ระบบบันทึก ประมวลผล และแสดงผลตัวชี้วัดงานอุบัติเหตุและฉุกเฉิน โรงพยาบาลหนองวัวซอ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===================== ER-KPI NongWuaSo — Design Tokens ===================== */
:root{
  --ink:#0B2A2E;
  --ink-soft:#3D5A5C;
  --paper:#F4F7F6;
  --surface:#FFFFFF;
  --surface-2:#EDF3F2;
  --border:#D8E3E1;
  --primary:#0E7C86;
  --primary-deep:#0A5960;
  --primary-tint:#E3F3F2;
  --accent:#E8543F;
  --accent-tint:#FCE7E3;
  --success:#1F8F52;
  --success-tint:#E4F5EA;
  --warning:#B4790A;
  --warning-tint:#FBF0DC;
  --critical:#D23A3A;
  --critical-tint:#FCE5E3;
  --violet:#7C5CFC;
  --violet-tint:#EFEAFE;
  --blue:#2E86DE;
  --blue-tint:#E4F0FC;
  --pink:#E0559D;
  --pink-tint:#FBE7F2;
  --amber:#E0A028;
  --amber-tint:#FCF1DC;
  --shadow-sm: 0 1px 2px rgba(11,42,46,.06), 0 1px 1px rgba(11,42,46,.04);
  --shadow-md: 0 6px 20px rgba(11,42,46,.10), 0 2px 6px rgba(11,42,46,.06);
  --shadow-lg: 0 16px 40px rgba(11,42,46,.16), 0 4px 12px rgba(11,42,46,.08);
  --radius-card:18px;
  --radius-input:10px;
  --radius-pill:999px;
  --font-display:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
  --font-body:'Sarabun','Noto Sans Thai',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF3F2; --ink-soft:#A9C4C2; --paper:#0A1B1D; --surface:#122C2F; --surface-2:#0E2426;
    --border:#1F4247; --primary:#3FB6BE; --primary-deep:#7ED6DB; --primary-tint:#123336;
    --accent:#FF8770; --accent-tint:#3A1E19; --success:#4FCB86; --success-tint:#123322;
    --warning:#E7AC42; --warning-tint:#332608; --critical:#F17272; --critical-tint:#3A1616;
    --violet:#A594FF; --violet-tint:#241C42; --blue:#6FB1F2; --blue-tint:#122A3E;
    --pink:#F090C4; --pink-tint:#3A1E30; --amber:#F0C266; --amber-tint:#332A10;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 20px rgba(0,0,0,.45); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ink:#EAF3F2; --ink-soft:#A9C4C2; --paper:#0A1B1D; --surface:#122C2F; --surface-2:#0E2426;
  --border:#1F4247; --primary:#3FB6BE; --primary-deep:#7ED6DB; --primary-tint:#123336;
  --accent:#FF8770; --accent-tint:#3A1E19; --success:#4FCB86; --success-tint:#123322;
  --warning:#E7AC42; --warning-tint:#332608; --critical:#F17272; --critical-tint:#3A1616;
  --violet:#A594FF; --violet-tint:#241C42; --blue:#6FB1F2; --blue-tint:#122A3E;
  --pink:#F090C4; --pink-tint:#3A1E30; --amber:#F0C266; --amber-tint:#332A10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 20px rgba(0,0,0,.45); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--primary);color:#fff;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}
.scrollx{overflow-x:auto;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ===================== App shell ===================== */
#app{display:flex;min-height:100vh;}

.rail{
  width:232px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; gap:4px; position:sticky; top:0; height:100vh;
}
.rail-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.rail-brand .logo{
  width:40px;height:40px;border-radius:12px;background:linear-gradient(155deg,var(--primary),var(--primary-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;
  box-shadow:var(--shadow-sm); flex:none;
}
.rail-brand .txt{min-width:0;}
.rail-brand .txt b{display:block;font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink);}
.rail-brand .txt span{display:block;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.nav-group{margin-top:10px;}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;padding:8px 12px 4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--ink-soft);transition:background .15s,color .15s;
}
.nav-item .ic{width:18px;text-align:center;flex:none;font-size:15px;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--primary-tint);color:var(--primary-deep);font-weight:700;}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%);
  border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:14px;
}
.topbar h1{font-size:18px;}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);}
.topbar .spacer{flex:1;}
.mobile-menu-btn{display:none;}
.content{padding:22px; max-width:1240px; width:100%; margin:0 auto; flex:1;}

.mobile-tabbar{display:none;}

@media (max-width:880px){
  .rail{position:fixed;inset:0 auto 0 0;transform:translateX(-104%);transition:transform .22s ease;z-index:60;box-shadow:var(--shadow-lg);}
  .rail.open{transform:translateX(0);}
  .rail-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;}
  .rail-scrim.show{display:block;}
  .mobile-menu-btn{display:flex;}
  .content{padding:14px;padding-bottom:84px;}
  .topbar{padding:10px 14px;}
}

/* ===================== Buttons & inputs ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-input);border:1px solid transparent;
  font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s ease,box-shadow .15s,background .15s,filter .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.05), var(--shadow-sm);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-soft{background:var(--primary-tint);color:var(--primary-deep);}
.btn-danger{background:var(--critical-tint);color:var(--critical);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field label .req{color:var(--accent);margin-left:2px;}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.input,.select,.textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-input);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.textarea{resize:vertical;min-height:64px;}
.input.computed{background:var(--surface-2);color:var(--ink-soft);font-family:var(--font-mono);}
.input.err,.select.err{border-color:var(--critical);box-shadow:0 0 0 3px var(--critical-tint);}
.errtext{color:var(--critical);font-size:12px;margin-top:4px;display:none;}
.field.invalid .errtext{display:block;}

.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:8px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:all .12s;user-select:none;
}
.chip:hover{border-color:var(--primary);color:var(--primary-deep);}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}

/* ===================== Cards ===================== */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
  box-shadow:var(--shadow-sm);
}
.glass{
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
}
.neu{
  background:var(--surface); border:1px solid var(--border);
  box-shadow: 6px 6px 14px rgba(11,42,46,.06), -6px -6px 14px rgba(255,255,255,.7);
}
:root[data-theme="dark"] .neu, @media (prefers-color-scheme:dark){ .neu{box-shadow:6px 6px 14px rgba(0,0,0,.4),-4px -4px 10px rgba(255,255,255,.03);} }

/* ===================== Entry hub ===================== */
.hero{
  border-radius:22px; padding:28px 26px; margin-bottom:22px; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--primary-deep),var(--primary) 60%, #12969f);
  color:#fff; box-shadow:var(--shadow-lg);
}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -10%, rgba(255,255,255,.25), transparent 60%);}
.hero h2{color:#fff;font-size:24px;position:relative;}
.hero p{color:rgba(255,255,255,.86);margin-top:8px;max-width:640px;position:relative;font-size:14px;}
.hero .actions{display:flex;gap:10px;margin-top:18px;position:relative;flex-wrap:wrap;}
.hero .btn-primary{background:#fff;color:var(--primary-deep);}
.hero .btn-ghost{border-color:rgba(255,255,255,.5);color:#fff;}
.hero .btn-ghost:hover{background:rgba(255,255,255,.14);}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.form-card{
  padding:18px; border-radius:16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
}
.form-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary);}
.form-card .badge{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-tint);color:var(--primary-deep);font-weight:800;font-family:var(--font-display);font-size:13px;
}
.form-card h3{font-size:15px;}
.form-card p{font-size:12.5px;color:var(--ink-soft);}
.form-card .kpirange{font-size:11px;color:var(--primary-deep);background:var(--primary-tint);padding:3px 9px;border-radius:99px;align-self:flex-start;font-weight:700;}

/* ===================== Form runner ===================== */
.progress-wrap{margin-bottom:18px;}
.progress-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .25s ease;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px;}

.section-title{font-size:13px;font-weight:800;color:var(--primary-deep);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px;}

.formbar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-radius:0 0 var(--radius-card) var(--radius-card);
}
.formbar .spacer{flex:1;}

.toast{
  position:fixed;bottom:24px;right:24px;z-index:200;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow-lg);
  background:var(--surface);border:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;max-width:340px;
  animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast.ok{border-left:4px solid var(--success);}
.toast.err{border-left:4px solid var(--critical);}
.toast .ttl{font-weight:700;font-size:13.5px;}
.toast .msg{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

/* ===================== Dashboard ===================== */
.dash-hero{
  border-radius:22px; padding:24px 26px; margin-bottom:20px; position:relative; overflow:hidden;
  background:linear-gradient(120deg,var(--violet) 0%, var(--primary) 55%, var(--blue) 100%);
  color:#fff; box-shadow:var(--shadow-lg); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.dash-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(560px 220px at 90% -20%, rgba(255,255,255,.28), transparent 60%);}
.dash-hero .txt{position:relative;min-width:0;}
.dash-hero h2{color:#fff;font-size:21px;display:flex;align-items:center;gap:10px;}
.dash-hero p{color:rgba(255,255,255,.9);margin-top:6px;font-size:13px;}
.dash-hero .actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;}
.dash-hero .btn-primary{background:#fff;color:var(--primary-deep);}
.dash-hero .btn-ghost{border-color:rgba(255,255,255,.55);color:#fff;}
.dash-hero .btn-ghost:hover{background:rgba(255,255,255,.16);}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:14px 16px;border-radius:14px;
  background:linear-gradient(180deg, var(--surface), var(--surface-2));}
.filters-bar .grp{display:flex;flex-direction:column;gap:4px;}
.filters-bar label{font-size:11px;font-weight:700;color:var(--ink-soft);}
.filters-bar input,.filters-bar select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;}
.updated-tag{font-size:11.5px;color:var(--ink-soft);margin-left:auto;display:flex;align-items:center;gap:6px;}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-tint);animation:pulse-dot 2s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.45;}}

.btn-import{background:linear-gradient(135deg,var(--success),#159a68);color:#fff;}
.btn-import:hover{filter:brightness(1.06);}
.btn-template{background:var(--blue-tint);color:var(--blue);}
.btn-template:hover{filter:brightness(0.97);}

.stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.stat-mini{padding:14px 18px;border-radius:14px;min-width:150px;flex:1;position:relative;overflow:hidden;border:1px solid var(--border);
  display:flex;align-items:center;gap:12px;}
.stat-mini .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.stat-mini .n{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.1;}
.stat-mini .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.stat-mini.c1{background:linear-gradient(135deg,var(--primary-tint),var(--surface));}
.stat-mini.c1 .ic{background:var(--primary-tint);color:var(--primary-deep);}
.stat-mini.c2{background:linear-gradient(135deg,var(--blue-tint),var(--surface));}
.stat-mini.c2 .ic{background:var(--blue-tint);color:var(--blue);}
.stat-mini.c3{background:linear-gradient(135deg,var(--amber-tint),var(--surface));}
.stat-mini.c3 .ic{background:var(--amber-tint);color:var(--amber);}
.stat-mini.c4{background:linear-gradient(135deg,var(--pink-tint),var(--surface));}
.stat-mini.c4 .ic{background:var(--pink-tint);color:var(--pink);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:26px;}
.kpi-card{padding:16px 16px 14px;border-radius:15px;border-left:4px solid var(--border);cursor:pointer;transition:box-shadow .12s,transform .12s;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:90px;height:90px;border-radius:50%;
  background:var(--cat-color, var(--primary)); opacity:.08; transform:translate(30%,-40%);}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.kpi-card.ok{border-left-color:var(--success);}
.kpi-card.warn{border-left-color:var(--warning);}
.kpi-card.bad{border-left-color:var(--critical);}
.kpi-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;min-height:32px;position:relative;}
.kpi-card .val{font-family:var(--font-display);font-size:27px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;position:relative;color:var(--cat-color, var(--ink));}
.kpi-card .val .unit{font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:2px;}
.kpi-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;position:relative;}
.kpi-card .target{font-size:10.5px;color:var(--ink-soft);}
.trend{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;}
.trend.up{background:var(--success-tint);color:var(--success);}
.trend.down{background:var(--critical-tint);color:var(--critical);}
.trend.flat{background:var(--surface-2);color:var(--ink-soft);}

.section-hd{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;}
.section-hd h2{font-size:17px;}

.chart-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
@media (max-width:900px){.chart-row{grid-template-columns:1fr;}}
.chart-card{padding:16px;border-top:3px solid var(--violet);}
.chart-card:nth-of-type(2){border-top-color:var(--blue);}
.chart-card h3{font-size:13.5px;margin-bottom:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 12px;font-size:11.5px;
  font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{border-radius:14px;border:1px solid var(--border);overflow:hidden;}

.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.pill.ok{background:var(--success-tint);color:var(--success);}
.pill.warn{background:var(--warning-tint);color:var(--warning);}
.pill.bad{background:var(--critical-tint);color:var(--critical);}
.pill.neu{background:var(--surface-2);color:var(--ink-soft);}

/* ===================== Admin ===================== */
.login-wrap{max-width:400px;margin:8vh auto;padding:34px;border-radius:20px;}
.login-wrap h2{font-size:20px;margin-bottom:6px;}
.login-wrap .sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
.demo-cred{background:var(--primary-tint);color:var(--primary-deep);padding:10px 12px;border-radius:10px;font-size:12px;margin-top:14px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--primary-deep);border-color:var(--primary);}

.modal-scrim{position:fixed;inset:0;background:rgba(8,20,22,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.modal-bd{padding:20px;}
.modal-ft{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-2);}

.kv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.kv-list .kv{padding:8px 0;border-bottom:1px dashed var(--border);}
.kv-list .kv b{display:block;font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
.kv-list .kv span{font-size:13.5px;}
@media (max-width:600px){.kv-list{grid-template-columns:1fr;}}

.stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.stat-mini{padding:12px 16px;border-radius:12px;min-width:120px;}
.stat-mini .n{font-family:var(--font-display);font-size:20px;font-weight:800;}
.stat-mini .l{font-size:11px;color:var(--ink-soft);}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
@media (max-width:760px){.settings-grid{grid-template-columns:1fr;}}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:38px;margin-bottom:10px;}

.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

@media (max-width:880px){
  .mobile-tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;
  }
  .mobile-tabbar .mt-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink-soft);font-size:10px;font-weight:700;cursor:pointer;}
  .mobile-tabbar .mt-item.active{color:var(--primary-deep);background:var(--primary-tint);}
  .mobile-tabbar .mt-item .ic{font-size:17px;}
}

@media print{
  .rail,.topbar,.mobile-tabbar,.formbar,.filters-bar,.dash-hero,.no-print{display:none !important;}
  .content{padding:0;max-width:100%;}
  body{background:#fff;}
  .card,.glass{box-shadow:none;border:1px solid #ccc;}
}

<script>
/* =========================================================================
   ER-KPI ระบบบันทึกและติดตามตัวชี้วัดงานอุบัติเหตุและฉุกเฉิน
   โรงพยาบาลหนองวัวซอ — Standalone Web Application
   ---------------------------------------------------------------------
   จุดตั้งค่าเดียว (Single Configuration Point) อยู่ในอ็อบเจ็กต์ DEFAULT_CONFIG ด้านล่าง
   สามารถแก้ไข ชื่อระบบ/หน่วยงาน/โลโก้/สี/GAS_API_URL ได้จากหน้า ผู้ดูแลระบบ > ตั้งค่า
   ซึ่งจะถูกบันทึกทับค่าเริ่มต้นนี้ใน localStorage (คีย์ erkpi_settings_v1)
   ========================================================================= */

/* ============================ 🔗 การเชื่อมต่อ Google Sheets ============================
 * วาง URL ของ Google Apps Script Web App (ที่ Deploy จาก Google Sheet ของคุณแล้ว) แทนที่ค่าด้านล่างนี้
 * ระบบจะดึง/บันทึกข้อมูลจาก Google Sheet ผ่าน URL นี้เสมอ (ไม่ต้องตั้งค่าเพิ่มในหน้าแอดมิน)
 *
 * วิธีสร้าง URL นี้ (สรุปย่อ — ดูขั้นตอนละเอียดในไฟล์ Code.gs ที่แนบมาให้):
 *   1) เปิด Google Sheet ที่ต้องการใช้เก็บข้อมูล
 *   2) เมนู ส่วนขยาย (Extensions) > Apps Script
 *   3) วางโค้ดจากไฟล์ Code.gs ที่แนบมา แล้วกด Deploy > New deployment > ประเภท "Web app"
 *      - Execute as: Me
 *      - Who has access: Anyone
 *   4) คัดลอก URL ที่ได้ (ลงท้ายด้วย /exec) มาวางแทนที่ข้อความด้านล่าง แล้วอัปโหลดไฟล์นี้ใหม่
 */
const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID_HERE/exec";

const DEFAULT_CONFIG = {
  systemName: 'ระบบบันทึกตัวชี้วัดงาน ER',
  orgName: 'โรงพยาบาลหนองวัวซอ',
  subOrgName: 'เขตสุขภาพที่ 8 · สสจ.อุดรธานี · ปีงบประมาณ 2569',
  logoText: 'ER',
  fiscalYear: '2569',
  gasApiUrl: GOOGLE_SHEETS_API_URL,   // ฝังไว้ในโค้ด — ระบบเชื่อมต่อ Google Sheets ผ่าน URL นี้เสมอ
  themePrimary: '#0E7C86',
  themeAccent: '#E8543F'
};
/** URL ของ Apps Script ถือว่า "ยังไม่ได้ตั้งค่า" ถ้าเป็นค่าว่างหรือยังเป็นข้อความตัวอย่างเริ่มต้น */
function isGasUrlConfigured(url){
  return !!url && !/PASTE_YOUR_DEPLOYMENT_ID_HERE/.test(url);
}

/* ============================ Utilities ============================ */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
};
const uid = (n=6) => Math.random().toString(36).slice(2, 2+n).toUpperCase();
const pad2 = (n) => String(n).padStart(2,'0');
function nowIso(){ return new Date().toISOString(); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtDateTime(iso){
  if(!iso) return '-';
  try{ const d=new Date(iso); return d.toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function fmtDate(s){
  if(!s) return '-';
  try{ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return s; }
}
function monthKey(dateStr){ return (dateStr||'').slice(0,7); } // YYYY-MM
function debounce(fn, ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; }

/** คำนวณผลต่างเวลาเป็นนาที จากสตริง HH:MM สองค่า รองรับกรณีข้ามเที่ยงคืน */
function computeMinutes(startHHMM, endHHMM){
  if(!startHHMM || !endHHMM) return null;
  const [sh,sm] = startHHMM.split(':').map(Number);
  const [eh,em] = endHHMM.split(':').map(Number);
  if([sh,sm,eh,em].some(x=>Number.isNaN(x))) return null;
  let start = sh*60+sm, end = eh*60+em;
  let diff = end - start;
  if(diff < 0) diff += 24*60; // ข้ามเที่ยงคืน
  return diff;
}

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================ Toast ============================ */
let toastTimer=null;
function toast(title, msg, type='ok'){
  let el = $('#toastEl');
  if(el) el.remove();
  el = document.createElement('div');
  el.id='toastEl';
  el.className = `toast ${type}`;
  el.innerHTML = `<div style="font-size:16px">${type==='ok'?'✅':'⚠️'}</div><div><div class="ttl">${esc(title)}</div><div class="msg">${esc(msg||'')}</div></div>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 3800);
}

/* ============================ Settings / Config store ============================ */
const SETTINGS_KEY = 'erkpi_settings_v1';
function loadSettings(){
  let cfg;
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    cfg = raw ? {...DEFAULT_CONFIG, ...JSON.parse(raw)} : {...DEFAULT_CONFIG};
  }catch(e){ cfg = {...DEFAULT_CONFIG}; }
  // URL การเชื่อมต่อ Google Sheets ถูกฝังไว้ในโค้ด (GOOGLE_SHEETS_API_URL) — ใช้ค่านี้เสมอ

  cfg.gasApiUrl = GOOGLE_SHEETS_API_URL;
  return cfg;
}

async function gasCall(action, payload){
  const url = CONFIG.gasApiUrl;
  if(action === 'read' || action === 'summary'){
    const qs = new URLSearchParams({action, ...payload});
    const res = await fetch(`${url}?${qs.toString()}`, {method:'GET'});
    if(!res.ok) throw new Error('เครือข่ายผิดพลาด: ' + res.status);
    return res.json();
  }
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // หลีกเลี่ยง CORS preflight ของ Apps Script
    body: JSON.stringify({action, ...payload})
  });
  if(!res.ok) throw new Error('เครือข่ายผิดพลาด: ' + res.status);
  return res.json();
}

function makeRecordId(formCode){
  const code = formCode.split('_')[0]; // "01".."13"
  const d = new Date();
  return `F${code}-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${uid(5)}`;
}

const SYSTEM_FIELDS = ['record_id','created_at','updated_at','record_status','created_by','updated_by'];

/** แปลงระเบียนภายใน (คีย์ = field.key) -> แถวสำหรับ Google Sheets (คีย์ = ชื่อคอลัมน์ต้นฉบับ) */
function toSheetRow(form, rec){
  const row = {};
  SYSTEM_FIELDS.forEach(k=>{ row[k] = rec[k] ?? ''; });
  form.fields.forEach(f=>{ row[f.label] = rec[f.key] ?? ''; });
  return row;
}
/** แปลงแถวจาก Google Sheets (คีย์ = ชื่อคอลัมน์ต้นฉบับ) -> ระเบียนภายใน (คีย์ = field.key) */
function fromSheetRow(form, row){
  const rec = {};
  SYSTEM_FIELDS.forEach(k=>{ rec[k] = row[k] ?? ''; });
  form.fields.forEach(f=>{ rec[f.key] = row[f.label] ?? ''; });
  return rec;
}

/** สร้างระเบียนใหม่ พร้อม system fields ครบถ้วน และป้องกันข้อมูลซ้ำด้วย record_id
 *  data: อ็อบเจ็กต์ที่คีย์ = field.key (ตัวแปรภายใน) */
async function createRecord(formCode, data){
  const form = formByCode(formCode);
  const rec = {
    record_id: makeRecordId(formCode),
    created_at: nowIso(),
    updated_at: nowIso(),
    record_status: 'active',
    created_by: getRecorderName() || 'ไม่ระบุผู้บันทึก',
    updated_by: getRecorderName() || 'ไม่ระบุผู้บันทึก',
    ...data
  };
  if(!isDemoMode()){
    const row = toSheetRow(form, rec);
    const r = await gasCall('create', {form: formCode, data: row});
    if(!r.success) throw new Error(r.message || 'บันทึกไม่สำเร็จ');
    return fromSheetRow(form, r.data);
  }
  const all = localList(formCode);
  all.push(rec);
  localSaveAll(formCode, all);
  return rec;
}

async function listRecords(formCode){
  const form = formByCode(formCode);
  if(!isDemoMode()){
    try{
      const r = await gasCall('read', {form: formCode});
      if(!r.success) throw new Error(r.message || 'ดึงข้อมูลไม่สำเร็จ');
      return (r.data || []).map(row=>fromSheetRow(form, row));
    }catch(e){
      console.warn('GAS read failed, falling back to local cache', e);
      toast('เชื่อมต่อ Google Sheets ไม่สำเร็จ','กำลังแสดงข้อมูลจากแคชล่าสุดในเครื่อง','err');
      return localList(formCode);
    }
  }
  return localList(formCode);
}

async function updateRecord(formCode, recordId, data){
  const form = formByCode(formCode);
  const patch = { ...data, updated_at: nowIso(), updated_by: getSession()?.username || getRecorderName() || 'ผู้ดูแลระบบ' };
  if(!isDemoMode()){
    const row = {};
    Object.keys(patch).forEach(k=>{
      const f = form.fields.find(x=>x.key===k);
      row[f ? f.label : k] = patch[k];
    });
    const r = await gasCall('update', {form: formCode, record_id: recordId, data: row});
    if(!r.success) throw new Error(r.message || 'แก้ไขไม่สำเร็จ');
    return fromSheetRow(form, r.data);
  }
  const all = localList(formCode);
  const idx = all.findIndex(r=>r.record_id===recordId);
  if(idx<0) throw new Error('ไม่พบระเบียนนี้');
  all[idx] = {...all[idx], ...patch};
  localSaveAll(formCode, all);
  return all[idx];
}

async function deleteRecord(formCode, recordId){
  if(!isDemoMode()){
    const r = await gasCall('delete', {form: formCode, record_id: recordId});
    if(!r.success) throw new Error(r.message || 'ลบไม่สำเร็จ');
    return true;
  }
  const all = localList(formCode).filter(r=>r.record_id!==recordId);
  localSaveAll(formCode, all);
  return true;
}

async function listAllRecords(){
  const out = {};
  for(const f of FORM_DEFS){ out[f.code] = await listRecords(f.code); }
  return out;
}

/* ============================ Validation & computed refresh ============================ */
function validateField(field, value){
  if(field.required && (value===undefined || value===null || String(value).trim()==='')){
    return 'กรุณากรอกข้อมูลนี้';
  }
  if(field.type==='number' && value!=='' && value!==undefined && value!==null){
    if(Number.isNaN(Number(value))) return 'กรุณากรอกตัวเลข';
    if(Number(value) < 0) return 'ค่าต้องไม่ติดลบ';
  }
  return '';
}

function recomputeAllDurations(form, state, root){
  form.fields.filter(f=>f.type==='computed').forEach(f=>{
    const [a,b] = f.computeFrom;
    const mins = computeMinutes(state[a], state[b]);
    state[f.key] = mins===null ? '' : mins;
    const el = root.querySelector(`[data-computed="${f.key}"]`);
    if(el) el.value = mins===null ? '—' : `${mins} นาที`;
  });
}

let ROUTE = {view:'entry', params:{}};
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {view:'entry', params:{}};
  if(parts[0]==='entry' && parts[1]) return {view:'entry-form', params:{code:parts.slice(1).join('/')}};
  if(parts[0]==='dashboard') return {view:'dashboard', params:{}};
  if(parts[0]==='admin'){
    if(!isLoggedIn() && parts[1]!=='login') { return {view:'admin-login', params:{}}; }
    if(!parts[1]) return {view:'admin-overview', params:{}};
    if(parts[1]==='login') return {view: isLoggedIn() ? 'admin-overview':'admin-login', params:{}};
    if(parts[1]==='records') return {view:'admin-records', params:{code:parts[2]}};
    if(parts[1]==='settings') return {view:'admin-settings', params:{}};
    if(parts[1]==='registry') return {view:'admin-registry', params:{}};
    return {view:'admin-overview', params:{}};
  }
  return {view:'entry', params:{}};
}

function fieldControlHtml(field, value){
  const val = value===undefined||value===null?'':value;
  const req = field.required ? '<span class="req">*</span>' : '';
  const noteVal = field._noteValue || '';
  let control = '';
  switch(field.type){
    case 'date':
      control = `<input class="input" type="date" data-key="${field.key}" value="${esc(val)}">`; break;
    case 'time':
      control = `<input class="input" type="time" data-key="${field.key}" value="${esc(val)}">`; break;
    case 'number':
      control = `<input class="input" type="number" inputmode="decimal" data-key="${field.key}" value="${esc(val)}" placeholder="${esc(field.placeholder||'')}">`; break;
    case 'textarea':
      control = `<textarea class="textarea" data-key="${field.key}" placeholder="${esc(field.placeholder||'')}">${esc(val)}</textarea>`; break;
    case 'computed':
      control = `<input class="input computed" type="text" data-computed="${field.key}" value="${val==='' ? '—' : val+' นาที'}" readonly tabindex="-1">`; break;
    case 'select':
      control = `<div class="chip-group" data-chipgroup="${field.key}">
        ${field.options.map(o=>`<div class="chip ${String(val)===o?'on':''}" data-val="${esc(o)}">${esc(o)}</div>`).join('')}
      </div>` + (field.note ? `<input class="input" style="margin-top:8px" type="text" data-key="${field.key}__note" placeholder="${esc(field.noteLabel||'รายละเอียดเพิ่มเติม')}" value="${esc(noteVal)}">` : '');
      break;
    default:
      control = `<input class="input" type="text" data-key="${field.key}" value="${esc(val)}" placeholder="${esc(field.placeholder||'')}">`;
  }
  return `<div class="field" data-field="${field.key}">
    <label>${esc(field.label)}${req}</label>
    ${control}
    <div class="errtext">กรุณากรอกข้อมูลนี้</div>

function groupFields(form){
  const groups = [{name:'ข้อมูลทั่วไป', fields:[]}, {name:'เวลาและระยะเวลา', fields:[]}, {name:'ผลลัพธ์ / รายละเอียดเพิ่มเติม', fields:[]}];
  form.fields.forEach(f=>{
    if(f.type==='time' || f.type==='computed') groups[1].fields.push(f);
    else if(['outcome','disposition','note'].includes(f.key) || f.key.includes('note') || f.type==='textarea') groups[2].fields.push(f);
    else groups[0].fields.push(f);
  });
  return groups.filter(g=>g.fields.length);
}

function collectFormState(form){
  const state = {};
  $$('#entryForm [data-key]').forEach(el=>{
    const key = el.getAttribute('data-key');
    if(key.endsWith('__note')) return;
    state[key] = el.value;
  });
  $$('#entryForm [data-chipgroup]').forEach(g=>{
    const key = g.getAttribute('data-chipgroup');
    const on = g.querySelector('.chip.on');
    state[key] = on ? on.getAttribute('data-val') : '';
    const noteEl = document.querySelector(`#entryForm [data-key="${key}__note"]`);
    if(noteEl){ state[key+'__note'] = noteEl.value; }
  });
  form.fields.filter(f=>f.type==='computed').forEach(f=>{
    const el = document.querySelector(`[data-computed="${f.key}"]`);
    // recompute from underlying state directly (more reliable than reading formatted text)
  });
  return state;
}

function applyComputed(form, state){
  form.fields.filter(f=>f.type==='computed').forEach(f=>{
    const [a,b] = f.computeFrom;
    const mins = computeMinutes(state[a], state[b]);
    state[f.key] = mins===null ? '' : mins;
    const el = document.querySelector(`[data-computed="${f.key}"]`);
    if(el) el.value = mins===null ? '—' : `${mins} นาที`;
  });
}

function updateProgress(form, state){
  const reqFields = form.fields.filter(f=>f.required);
  const filled = reqFields.filter(f=>{
    const v = state[f.key];
    return v!==undefined && v!==null && String(v).trim()!=='';
  });
  const pct = reqFields.length ? Math.round(filled.length/reqFields.length*100) : 100;
  const bar = $('#progBar'); if(bar) bar.style.width = pct+'%';
  const lbl = $('#progLabel'); if(lbl) lbl.textContent = `กรอกแล้ว ${pct}% (${filled.length}/${reqFields.length} ช่องบังคับ)`;
}

function bindEntryForm(code){
  const form = formByCode(code);
  if(!form) return;
  let state = loadDraft(code) || {};

  // ใส่ค่าจาก draft กลับเข้าไปในฟอร์ม
  Object.keys(state).forEach(key=>{
    if(key.endsWith('__note')) return;
    const chip = document.querySelector(`#entryForm [data-chipgroup="${key}"]`);
    if(chip){
      chip.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.getAttribute('data-val')===state[key]));
      const noteEl = document.querySelector(`#entryForm [data-key="${key}__note"]`);
      if(noteEl && state[key+'__note']) noteEl.value = state[key+'__note'];
      return;
    }
    const el = document.querySelector(`#entryForm [data-key="${key}"]`);
    if(el) el.value = state[key];
  });
  applyComputed(form, state);
  updateProgress(form, state);
  if(Object.keys(state).length) toast('กู้คืนแบบร่าง', 'พบข้อมูลที่บันทึกร่างไว้ก่อนหน้า');

  const root = $('#entryForm');
  root.addEventListener('input', (e)=>{
    const key = e.target.getAttribute('data-key');
    if(key){ state[key] = e.target.value; }
    applyComputed(form, state);
    updateProgress(form, state);
    const fieldWrap = e.target.closest('.field');
    if(fieldWrap) fieldWrap.classList.remove('invalid');
  });
  $$('.chip', root).forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const group = chip.closest('[data-chipgroup]');
      const key = group.getAttribute('data-chipgroup');
      group.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
      state[key] = chip.getAttribute('data-val');
      applyComputed(form, state);
      updateProgress(form, state);
      const fieldWrap = group.closest('.field');
      if(fieldWrap) fieldWrap.classList.remove('invalid');
    });
  });

  $('#btnSetRecorder').addEventListener('click', ()=>{
    const name = prompt('ชื่อผู้บันทึกข้อมูล (จะถูกบันทึกในระบบทุกครั้งที่กรอกฟอร์ม)', getRecorderName());
    if(name!==null){ setRecorderName(name.trim()); $('#recorderNameShow').textContent = name.trim()||'ยังไม่ระบุ'; }
  });

  $('#btnBack').addEventListener('click', ()=> history.length>1 ? history.back() : go('#/entry'));

  $('#btnClear').addEventListener('click', ()=>{
    if(!confirm('ล้างข้อมูลที่กรอกทั้งหมดในฟอร์มนี้ใช่หรือไม่?')) return;
    state = {};
    clearDraft(code);
    render();
  });

  $('#btnDraft').addEventListener('click', ()=>{
    saveDraft(code, state);
    toast('บันทึกร่างแล้ว', 'สามารถกลับมากรอกต่อภายหลังได้');
  });

  let submitting = false;
  $('#btnSubmit').addEventListener('click', async ()=>{
    if(submitting) return;
    // validate
    let firstInvalid = null;
    let ok = true;
    form.fields.forEach(f=>{
      if(f.type==='computed') return;
      const err = validateField(f, state[f.key]);
      const wrap = document.querySelector(`.field[data-field="${f.key}"]`);
      if(err){
        ok = false;
        if(wrap){ wrap.classList.add('invalid'); if(!firstInvalid) firstInvalid = wrap; }
      } else if(wrap){ wrap.classList.remove('invalid'); }
    });
    if(!ok){
      toast('กรอกข้อมูลไม่ครบถ้วน', 'กรุณาตรวจสอบช่องที่มีเครื่องหมาย * สีแดง', 'err');
      if(firstInvalid) firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    submitting = true;
    const btn = $('#btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก...';
    try{
      // รวมค่า note ของ select เข้ากับคอลัมน์เดิม (ไม่เพิ่มตัวแปรใหม่) — คีย์ = field.key ภายในระบบ
      const finalData = {};
      form.fields.forEach(f=>{
        if(f.type==='computed'){ finalData[f.key] = state[f.key]===''||state[f.key]===undefined ? '' : state[f.key]; return; }
        let v = state[f.key] ?? '';
        if(f.note && state[f.key+'__note']) v = `${v} ${state[f.key+'__note']}`.trim();
        finalData[f.key] = v;
      });
      await createRecord(code, finalData);
      clearDraft(code);
      toast('บันทึกสำเร็จ', `บันทึกข้อมูลแบบฟอร์ม ${formNo(form)} เรียบร้อยแล้ว`);
      state = {};
      render(); // เริ่มรายการใหม่
    }catch(e){
      console.error(e);
      toast('บันทึกไม่สำเร็จ', e.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่', 'err');
      btn.disabled = false;
      btn.innerHTML = '✅ บันทึกข้อมูล';
    }
    submitting = false;
  });
}

/* ============================ Dashboard: KPI calculators ============================ */
function numOrNull(v){ const n = Number(v); return (v===''||v===undefined||v===null||Number.isNaN(n)) ? null : n; }
function pct(numerator, denominator){ return denominator>0 ? Math.round((numerator/denominator)*1000)/10 : null; }
function avgField(recs, key){
  const vals = (recs||[]).map(r=>numOrNull(r[key])).filter(v=>v!==null);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function pctLE(recs, key, threshold){
  recs = recs||[];
  const vals = recs.map(r=>numOrNull(r[key])).filter(v=>v!==null);
  if(!vals.length) return null;
  return pct(vals.filter(v=>v<=threshold).length, vals.length);
}
function pctOutcomeDeath(recs){
  recs = recs||[];
  if(!recs.length) return null;
  return pct(recs.filter(r=>String(r.outcome||'').includes('เสียชีวิต')).length, recs.length);
}
function getManualSatisfaction(mKey){
  try{
    const store = JSON.parse(localStorage.getItem('erkpi_satisfaction_v1')) || {};
    return store[mKey] !== undefined ? Number(store[mKey]) : null;
  }catch(e){ return null; }
}
function setManualSatisfaction(mKey, val){
  const store = (()=>{ try{ return JSON.parse(localStorage.getItem('erkpi_satisfaction_v1'))||{}; }catch(e){ return {}; } })();
  store[mKey] = val;
  localStorage.setItem('erkpi_satisfaction_v1', JSON.stringify(store));
}

function parseTarget(target){
  if(!target) return null;
  const t = target.replace(/,/g,'');
  let m;
  if((m = t.match(/≥\s*([\d.]+)/))) return {op:'>=', val:parseFloat(m[1])};
  if((m = t.match(/^<\s*([\d.]+)/))) return {op:'<', val:parseFloat(m[1])};
  if((m = t.match(/≤\s*([\d.]+)/))) return {op:'<=', val:parseFloat(m[1])};
  if(t.trim()==='0') return {op:'==', val:0};
  return null;
}
function kpiStatus(target, value){
  if(value===null || value===undefined || Number.isNaN(value)) return '';
  const t = parseTarget(target);
  if(!t) return '';
  if(t.op==='>=') return value>=t.val ? 'ok':'bad';
  if(t.op==='<') return value<t.val ? 'ok':'bad';
  if(t.op==='<=') return value<=t.val ? 'ok':'bad';
  if(t.op==='==') return value===t.val ? 'ok':'bad';
  return '';
}

/** กรองระเบียนของทุกฟอร์มตามช่วงวันที่ (inclusive) */
function filterByRange(allData, fromStr, toStr){
  const out = {};
  FORM_DEFS.forEach(f=>{
    const dateKey = FORM_DATE_FIELD[f.code];
    const recs = allData[f.code]||[];
    out[f.code] = recs.filter(r=>{
      const d = r[dateKey];
      if(!d) return false;
      return (!fromStr || d>=fromStr) && (!toStr || d<=toStr);
    });
  });
  return out;
}
function shiftMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function monthRange(ym){ return {from:`${ym}-01`, to:`${ym}-31`}; }

/* ============================ Simple inline SVG charts ============================ */
function svgBarChart(labels, values, opts={}){
  const w = opts.w||420, h = opts.h||180, pad = {l:34,r:10,t:10,b:26};
  const max = Math.max(1, ...values);
  const bw = (w-pad.l-pad.r) / values.length;
  const bars = values.map((v,i)=>{
    const bh = (h-pad.t-pad.b) * (v/max);
    const x = pad.l + i*bw + bw*0.18;
    const y = h-pad.b-bh;
    const bwidth = bw*0.64;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwidth.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="var(--primary)" opacity="0.88"><title>${esc(labels[i])}: ${v}</title></rect>
      <text x="${(x+bwidth/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">${esc(labels[i])}</text>
      <text x="${(x+bwidth/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${v}</text>`;
  }).join('');
  const gridY = [0,0.5,1].map(f=>{
    const y = pad.t + (h-pad.t-pad.b)*(1-f);
    return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="กราฟแท่ง">${gridY}${bars}</svg>`;
}
function svgLineChart(labels, values, opts={}){
  const w = opts.w||420, h = opts.h||180, pad = {l:30,r:12,t:14,b:24};
  const max = Math.max(1, ...values), min = 0;
  const stepX = values.length>1 ? (w-pad.l-pad.r)/(values.length-1) : 0;
  const pts = values.map((v,i)=>{
    const x = pad.l + i*stepX;
    const y = pad.t + (h-pad.t-pad.b)*(1-(v-min)/(max-min||1));
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad.b} L${pts[0][0].toFixed(1)},${h-pad.b} Z`;
  const gridY = [0,0.5,1].map(f=>{
    const y = pad.t + (h-pad.t-pad.b)*(1-f);
    return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');
  const lastPt = pts[pts.length-1];
  const labelsSvg = labels.map((l,i)=> i%Math.ceil(labels.length/6||1)===0 ? `<text x="${pts[i][0].toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${esc(l)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="กราฟเส้น">
    ${gridY}
    <path d="${area}" fill="var(--primary)" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${lastPt ? `<circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="4" fill="var(--accent)"/>` : ''}
    ${labelsSvg}
  </svg>`;
}

async function bindDashboard(){
  const $from = $('#fltFrom'), $to = $('#fltTo'), $quick = $('#fltQuick'), $search = $('#fltSearch');
  $('#btnDownloadTemplate').addEventListener('click', downloadExcelTemplate);
  $('#btnImportExcel').addEventListener('click', ()=> $('#excelFileInput').click());
  $('#excelFileInput').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(file) await handleExcelImport(file);
  });
  async function reload(){
    $('#updatedTag').innerHTML = `<span class="dot-live"></span>กำลังโหลด...`;
    const all = await listAllRecords();
    const from = $from.value, to = $to.value;
    const filtered = filterByRange(all, from, to);
    // previous period ของความยาวเท่ากัน สำหรับคำนวณแนวโน้ม
    const fromD = new Date(from), toD = new Date(to);
    const spanDays = Math.max(1, Math.round((toD-fromD)/86400000));
    const prevTo = new Date(fromD.getTime()-86400000);
    const prevFrom = new Date(prevTo.getTime()-spanDays*86400000);
    const pf = `${prevFrom.getFullYear()}-${pad2(prevFrom.getMonth()+1)}-${pad2(prevFrom.getDate())}`;
    const pt = `${prevTo.getFullYear()}-${pad2(prevTo.getMonth()+1)}-${pad2(prevTo.getDate())}`;
    const prevFiltered = filterByRange(all, pf, pt);
    __CURRENT_PERIOD_KEY = monthKey(to || todayStr());
    __dashCache = {all, filtered, prevFiltered, from, to};
    let maxUpdated = null;
    Object.values(all).flat().forEach(r=>{ if(r.updated_at && (!maxUpdated || r.updated_at>maxUpdated)) maxUpdated = r.updated_at; });
    $('#updatedTag').innerHTML = `<span class="dot-live"></span>อัปเดตล่าสุด: ${maxUpdated ? fmtDateTime(maxUpdated) : 'ยังไม่มีข้อมูล'} ${isDemoMode()?'· โหมดสาธิต':'· เชื่อมต่อ Google Sheets'}`;
    paintDashboard();
  }
  function paintDashboard(){
    const {filtered, prevFiltered} = __dashCache;
    const q = ($search.value||'').trim().toLowerCase();
    const body = $('#dashBody');
    const visibleKpis = DASHBOARD_KPIS.filter(k=> !q || k.label.toLowerCase().includes(q));

    // สรุปสถิติด่วน
    const totalVisits = (filtered['01_ER_Daily_Log']||[]).length;
    const totalIncidents = (filtered['10_Incident_Safety']||[]).length;
    const totalRefer = (filtered['09_Refer']||[]).length;
    const totalRecords = Object.values(filtered).reduce((s,a)=>s+a.length,0);

    let html = `
    <div class="stat-strip">
      <div class="stat-mini c1"><div class="ic">🗂️</div><div><div class="n mono">${totalRecords}</div><div class="l">ระเบียนทั้งหมดในช่วงที่เลือก</div></div></div>
      <div class="stat-mini c2"><div class="ic">🚑</div><div><div class="n mono">${totalVisits}</div><div class="l">ผู้รับบริการ ER (ราย)</div></div></div>
      <div class="stat-mini c3"><div class="ic">🔁</div><div><div class="n mono">${totalRefer}</div><div class="l">การส่งต่อ (ราย)</div></div></div>
      <div class="stat-mini c4"><div class="ic">⚠️</div><div><div class="n mono">${totalIncidents}</div><div class="l">อุบัติการณ์ที่บันทึก (ราย)</div></div></div>
    </div>`;

    // charts row
    const triageVals = KPI_CALCULATORS.triageDist(filtered);
    const erRecs = filtered['01_ER_Daily_Log']||[];
    const byDay = {};
    erRecs.forEach(r=>{ if(r.date) byDay[r.date] = (byDay[r.date]||0)+1; });
    const days = Object.keys(byDay).sort();
    html += `<div class="chart-row">
      <div class="card chart-card"><h3>จำนวนผู้รับบริการ ER ตามวัน</h3>${days.length? svgLineChart(days.map(d=>d.slice(5)), days.map(d=>byDay[d])) : '<div class="empty-state" style="padding:20px"><div class="ic">📈</div>ยังไม่มีข้อมูลในช่วงนี้</div>'}</div>
      <div class="card chart-card"><h3>สัดส่วนระดับ Triage (1–5)</h3>${svgBarChart(['1','2','3','4','5'], triageVals)}</div>
    </div>`;

    html += `<div class="section-hd"><h2>ตัวชี้วัดหลัก 25 รายการ (Dashboard ผู้บริหาร)</h2></div>`;
    if(!visibleKpis.length){
      html += `<div class="empty-state"><div class="ic">🔍</div>ไม่พบตัวชี้วัดที่ค้นหา</div>`;
    } else {
      html += `<div class="kpi-grid">`;
      visibleKpis.forEach(kpi=>{
        let val;
        if(kpi.calc==='triageDist'){ return; } // handled in chart above, skip card
        val = KPI_CALCULATORS[kpi.calc] ? KPI_CALCULATORS[kpi.calc](filtered) : null;
        const prevVal = kpi.calc==='manualSatisfaction' ? null : (KPI_CALCULATORS[kpi.calc] ? KPI_CALCULATORS[kpi.calc](prevFiltered) : null);
        const status = kpiStatus(kpi.target, val);
        let trendHtml = '<span class="trend flat">–</span>';
        if(val!==null && prevVal!==null && !Array.isArray(val)){
          const delta = Math.round((val-prevVal)*10)/10;
          if(delta!==0){
            const dir = delta>0?'up':'down';
            trendHtml = `<span class="trend ${dir}">${delta>0?'▲':'▼'} ${Math.abs(delta)}</span>`;
          }
        }
        html += `<div class="card kpi-card ${status}" data-kpi="${kpi.id}" style="--cat-color:${catColorForKpi(kpi)}">
          <div class="lbl">${esc(kpi.label)}</div>
          <div class="val">${fmtKpiValue(kpi, val)}</div>
          <div class="meta"><span class="target">เป้าหมาย: ${esc(kpi.target)}</span>${trendHtml}</div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="section-hd"><h2>รายละเอียดล่าสุดตามแบบฟอร์ม (ไม่แสดง HN/ข้อมูลส่วนบุคคล)</h2></div>
    <div class="table-wrap scrollx"><table>
      <thead><tr><th>แบบฟอร์ม</th><th>วันที่</th><th>สรุปย่อ</th></tr></thead>
      <tbody>${recentPublicRows(filtered)}</tbody>
    </table></div>`;

    body.innerHTML = html;
    $$('.kpi-card[data-kpi]', body).forEach(card=>{
      card.addEventListener('click', ()=> openKpiDrilldown(card.getAttribute('data-kpi')));
    });
  }

  function recentPublicRows(filtered){
    const rows = [];
    FORM_DEFS.forEach(f=>{
      (filtered[f.code]||[]).slice(-5).forEach(r=>{
        const dateKey = FORM_DATE_FIELD[f.code];
        const summaryField = f.fields.find(x=>['outcome','disposition','status','incident_type'].includes(x.key));
        rows.push({code:f.code, date:r[dateKey], summary: summaryField ? r[summaryField.key] : ''});
      });
    });
    rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    if(!rows.length) return `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);padding:24px;">ยังไม่มีข้อมูล</td></tr>`;
    return rows.slice(0,20).map(r=>`<tr><td>${esc(shortTitle(formByCode(r.code)))}</td><td class="mono">${esc(fmtDate(r.date))}</td><td>${esc(r.summary||'-')}</td></tr>`).join('');
  }

  $quick.addEventListener('change', ()=>{
    const today = todayStr();
    if($quick.value==='month'){ $from.value = `${monthKey(today)}-01`; $to.value = today; }
    if($quick.value==='lastmonth'){ const lm = shiftMonth(monthKey(today),-1); $from.value = `${lm}-01`; $to.value = `${lm}-28`; }
    if($quick.value==='quarter'){ const q = shiftMonth(monthKey(today),-2); $from.value = `${q}-01`; $to.value = today; }
    if($quick.value==='all'){ $from.value = '2000-01-01'; $to.value = '2100-01-01'; }
    reload();
  });
  $from.addEventListener('change', reload);
  $to.addEventListener('change', reload);
  $search.addEventListener('input', debounce(()=>{ if(__dashCache) paintDashboard(); }, 150));
  $('#fltReset').addEventListener('click', ()=>{
    $from.value = defFromToday(); $to.value = todayStr(); $quick.value='month'; $search.value=''; reload();
  });
  function defFromToday(){ return `${monthKey(todayStr())}-01`; }

  reload();
}

function openKpiDrilldown(kpiId){
  const kpi = DASHBOARD_KPIS.find(k=>k.id===kpiId);
  if(!kpi || !__dashCache) return;
  const form = kpi.form!=='manual' ? formByCode(kpi.form) : null;
  const recs = form ? (__dashCache.filtered[form.code]||[]) : [];
  const dateKey = form ? FORM_DATE_FIELD[form.code] : null;
  const rowsHtml = recs.length ? recs.slice(-30).reverse().map(r=>{
    const cells = form.fields.filter(f=>!PII_FIELDS.has(f.key)).slice(0,4).map(f=>`<td>${esc(r[f.key])}</td>`).join('');
    return `<tr><td class="mono">${esc(fmtDate(r[dateKey]))}</td>${cells}</tr>`;
  }).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:20px;">ไม่มีข้อมูลในช่วงที่เลือก</td></tr>`;
  const headCells = form ? form.fields.filter(f=>!PII_FIELDS.has(f.key)).slice(0,4).map(f=>`<th>${esc(f.label)}</th>`).join('') : '';
  openModal(`
    <div class="modal-hd"><h3>${esc(kpi.label)}</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-bd">
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">ที่มา: ${form?esc(form.title):'กรอกด้วยตนเองรายเดือน'} · เป้าหมาย: ${esc(kpi.target)} · <b>ไม่แสดง HN หรือข้อมูลระบุตัวบุคคล</b></p>
      ${form ? `<div class="table-wrap scrollx"><table><thead><tr><th>วันที่</th>${headCells}</tr></thead><tbody>${rowsHtml}</tbody></table></div>` :
        `<div class="field"><label>คะแนนความพึงพอใจเดือน ${esc(__CURRENT_PERIOD_KEY)} (%)</label><input class="input" type="number" id="satInput" min="0" max="100" value="${getManualSatisfaction(__CURRENT_PERIOD_KEY)??''}"></div>
         <button class="btn btn-primary btn-sm" id="satSave">บันทึกคะแนน</button>`}
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" data-close>ปิด</button></div>
  `);
  if(!form){
    $('#satSave').addEventListener('click', ()=>{
      setManualSatisfaction(__CURRENT_PERIOD_KEY, Number($('#satInput').value));
      toast('บันทึกแล้ว','คะแนนความพึงพอใจถูกบันทึก');
      closeModal();
      if(ROUTE.view==='dashboard') render();
    });
  }
}

/* ============================ Modal helper ============================ */
function openModal(innerHtml){
  closeModal();
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.id = 'modalScrim';
  scrim.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener('click', (e)=>{ if(e.target===scrim) closeModal(); });
  $$('[data-close]', scrim).forEach(b=>b.addEventListener('click', closeModal));
}

async function bindAdminRecords(code){
  code = code || FORM_DEFS[0].code;
  $$('.tab[data-go]').forEach(t=>t.addEventListener('click', ()=>go(t.getAttribute('data-go'))));
  const sel = $('#recFormSel');
  sel.addEventListener('change', ()=> go(`#/admin/records/${sel.value}`));
  const searchEl = $('#recSearch');

  let records = [];
  const form = formByCode(code);

  async function load(){
    $('#recBody').innerHTML = `<div class="empty-state"><div class="ic">⏳</div>กำลังโหลด...</div>`;
    records = await listRecords(code);
    paint();
  }
  function paint(){
    const q = (searchEl.value||'').toLowerCase();
    const visCols = form.fields.slice(0,6);
    const filtered = records.filter(r=>{
      if(!q) return true;
      return Object.values(r).some(v=>String(v??'').toLowerCase().includes(q));
    }).sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
    let html = `<div class="table-wrap scrollx"><table><thead><tr>
      <th>Record ID</th>${visCols.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th>บันทึกเมื่อ</th><th>สถานะ</th><th></th>
    </tr></thead><tbody>`;
    if(!filtered.length){
      html += `<tr><td colspan="${visCols.length+4}" style="text-align:center;padding:30px;color:var(--ink-soft);">ไม่พบข้อมูล</td></tr>`;
    }
    filtered.forEach(r=>{
      html += `<tr>
        <td class="mono">${esc(r.record_id)}</td>
        ${visCols.map(f=>`<td>${esc(String(r[f.key]??'').slice(0,28))}</td>`).join('')}
        <td class="mono">${esc(fmtDateTime(r.created_at))}</td>
        <td><span class="pill ${r.record_status==='active'?'ok':'neu'}">${esc(r.record_status||'active')}</span></td>
        <td style="white-space:nowrap;">
          <button class="icon-btn" data-view="${esc(r.record_id)}" title="ดูรายละเอียด">👁</button>
          <button class="icon-btn" data-edit="${esc(r.record_id)}" title="แก้ไข">✏️</button>
          <button class="icon-btn" data-del="${esc(r.record_id)}" title="ลบ">🗑</button>
        </td>
      </tr>`;
    });
    html += `</tbody></table></div><div style="margin-top:10px;font-size:12px;color:var(--ink-soft);">ทั้งหมด ${filtered.length} รายการ</div>`;
    $('#recBody').innerHTML = html;
    $$('[data-view]', $('#recBody')).forEach(b=>b.addEventListener('click', ()=>viewRecord(b.getAttribute('data-view'))));
    $$('[data-edit]', $('#recBody')).forEach(b=>b.addEventListener('click', ()=>editRecord(b.getAttribute('data-edit'))));
    $$('[data-del]', $('#recBody')).forEach(b=>b.addEventListener('click', ()=>deleteRecordFlow(b.getAttribute('data-del'))));
  }

  function findRec(id){ return records.find(r=>r.record_id===id); }

  function viewRecord(id){
    const r = findRec(id); if(!r) return;
    const kv = form.fields.map(f=>`<div class="kv"><b>${esc(f.label)}</b><span>${esc(r[f.key]) || '-'}</span></div>`).join('');
    const sys = SYSTEM_FIELDS.map(k=>`<div class="kv"><b>${esc(k)}</b><span class="mono">${esc(k.includes('_at')?fmtDateTime(r[k]):r[k])}</span></div>`).join('');
    openModal(`
      <div class="modal-hd"><h3>รายละเอียดระเบียน ${esc(r.record_id)}</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="modal-bd">
        <div class="section-title">ข้อมูลระบบ</div>
        <div class="kv-list">${sys}</div>
        <div class="section-title">ข้อมูลแบบฟอร์ม</div>
        <div class="kv-list">${kv}</div>
      </div>
      <div class="modal-ft"><button class="btn btn-ghost" data-close>ปิด</button></div>
    `);
  }

  function editRecord(id){
    const r = findRec(id); if(!r) return;
    const fieldsHtml = form.fields.map(f=>{
      if(f.type==='computed') return '';
      return fieldControlHtml(f, r[f.key]);
    }).join('');
    openModal(`
      <div class="modal-hd"><h3>แก้ไขระเบียน ${esc(r.record_id)}</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="modal-bd"><form id="editForm">${fieldsHtml}</form></div>
      <div class="modal-ft"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-primary" id="saveEditBtn">บันทึกการแก้ไข</button></div>
    `);
    // preselect chip values
    form.fields.forEach(f=>{
      if(f.type!=='select') return;
      const g = document.querySelector(`#editForm [data-chipgroup="${f.key}"]`);
      if(g) g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.getAttribute('data-val')===String(r[f.key]||'').split(' ')[0] || c.getAttribute('data-val')===r[f.key]));
    });
    $$('#editForm .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const g = chip.closest('[data-chipgroup]');
        g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
        chip.classList.add('on');
      });
    });
    $('#saveEditBtn').addEventListener('click', async ()=>{
      if(!confirm('ยืนยันการแก้ไขระเบียนนี้ใช่หรือไม่?')) return;
      const patch = {};
      form.fields.forEach(f=>{
        if(f.type==='computed') return;
        if(f.type==='select'){
          const g = document.querySelector(`#editForm [data-chipgroup="${f.key}"]`);
          const on = g ? g.querySelector('.chip.on') : null;
          patch[f.key] = on ? on.getAttribute('data-val') : '';
        } else {
          const el = document.querySelector(`#editForm [data-key="${f.key}"]`);
          patch[f.key] = el ? el.value : r[f.key];
        }
      });
      // recompute durations after edit
      form.fields.filter(f=>f.type==='computed').forEach(f=>{
        const [a,b] = f.computeFrom;
        const mins = computeMinutes(patch[a] ?? r[a], patch[b] ?? r[b]);
        patch[f.key] = mins===null?'':mins;
      });
      try{
        await updateRecord(code, id, patch);
        toast('แก้ไขสำเร็จ','บันทึกการเปลี่ยนแปลงเรียบร้อย');
        closeModal();
        load();
      }catch(e){ toast('แก้ไขไม่สำเร็จ', e.message, 'err'); }
    });
  }

  function deleteRecordFlow(id){
    openModal(`
      <div class="modal-hd"><h3>ยืนยันการลบ</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="modal-bd">ต้องการลบระเบียน <b class="mono">${esc(id)}</b> ใช่หรือไม่? การลบไม่สามารถย้อนกลับได้</div>
      <div class="modal-ft"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-danger" id="confirmDel">ลบระเบียน</button></div>
    `);
    $('#confirmDel').addEventListener('click', async ()=>{
      try{
        await deleteRecord(code, id);
        toast('ลบสำเร็จ','ลบระเบียนเรียบร้อยแล้ว');
        closeModal();
        load();
      }catch(e){ toast('ลบไม่สำเร็จ', e.message, 'err'); }
    });
  }

  searchEl.addEventListener('input', debounce(paint, 150));

  $('#exportCsv').addEventListener('click', ()=>{
    const cols = ['record_id', ...form.fields.map(f=>f.label), 'created_at','updated_at','record_status','created_by','updated_by'];
    const lines = [cols.map(csvEsc).join(',')];
    records.forEach(r=>{
      const row = [r.record_id, ...form.fields.map(f=>r[f.key]), r.created_at, r.updated_at, r.record_status, r.created_by, r.updated_by];
      lines.push(row.map(csvEsc).join(','));
    });
    downloadFile(`${code}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  });
  $('#exportJson').addEventListener('click', ()=>{
    downloadFile(`${code}.json`, JSON.stringify(records, null, 2), 'application/json');
  });
  $('#printBtn').addEventListener('click', ()=> window.print());

  load();
}
function csvEsc(v){
  const s = String(v ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============================ นำเข้า/ส่งออกข้อมูลผ่านไฟล์ Excel ============================
 * โครงสร้างไฟล์: 1 ชีต (sheet) ต่อ 1 แบบฟอร์ม โดยตั้งชื่อชีตตรงกับรหัสแบบฟอร์ม (เช่น "01_ER_Daily_Log")
 * แถวแรกของแต่ละชีตคือหัวคอลัมน์ (ชื่อฟิลด์ภาษาไทยของแบบฟอร์มนั้น ๆ) — ใช้ปุ่ม "ดาวน์โหลดเทมเพลต Excel" เพื่อได้ไฟล์ที่มีรูปแบบถูกต้อง
 */
function downloadExcelTemplate(){
  if(typeof XLSX === 'undefined'){ toast('ไม่พร้อมใช้งาน','ไม่สามารถโหลดไลบรารี Excel ได้ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต','err'); return; }
  const wb = XLSX.utils.book_new();
  FORM_DEFS.forEach(form=>{
    const headers = [...SYSTEM_FIELDS, ...form.fields.map(f=>f.label)];
    const sampleRow = form.fields.map(f=> f.type==='date' ? todayStr() : (f.type==='time' ? '08:00' : ''));
    const ws = XLSX.utils.aoa_to_sheet([headers, [...SYSTEM_FIELDS.map(()=>''), ...sampleRow]]);
    XLSX.utils.book_append_sheet(wb, ws, form.code.slice(0,31));
  });
  XLSX.writeFile(wb, 'erkpi_import_template.xlsx');
  toast('ดาวน์โหลดเทมเพลตแล้ว','กรอกข้อมูลในแต่ละชีตตามแบบฟอร์ม แล้วนำกลับมานำเข้าใหม่ได้เลย');
}

async function handleExcelImport(file){
  if(typeof XLSX === 'undefined'){ toast('ไม่พร้อมใช้งาน','ไม่สามารถโหลดไลบรารี Excel ได้ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต','err'); return; }
  if(isDemoMode()){
    toast('ยังไม่ได้เชื่อมต่อ Google Sheets','กรุณาตั้งค่าตัวแปร GOOGLE_SHEETS_API_URL ในโค้ดก่อนนำเข้าข้อมูล (ข้อมูลที่นำเข้าจะถูกส่งตรงไปยัง Google Sheet)','err');
    return;
  }
  const importBtn = $('#btnImportExcel');
  if(importBtn){ importBtn.disabled = true; importBtn.innerHTML = `<span class="spin"></span> กำลังนำเข้าข้อมูล...`; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const summary = [];
    let anyMatched = false;
    for(const sheetName of wb.SheetNames){
      const form = formByCode(sheetName.trim());
      if(!form) continue; // ข้ามชีตที่ชื่อไม่ตรงกับรหัสแบบฟอร์มในระบบ
      anyMatched = true;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
      let ok = 0, fail = 0;
      for(const row of rows){
        try{
          const rec = fromSheetRow(form, row);
          const data = {};
          form.fields.forEach(f=>{
            const v = rec[f.key];
            if(v !== '' && v !== null && v !== undefined) data[f.key] = v;
          });
          if(!Object.keys(data).length) continue; // แถวว่าง ข้าม
          await createRecord(form.code, data);
          ok++;
        }catch(e){ fail++; }
      }
      if(ok||fail) summary.push(`${shortTitle(form)}: นำเข้า ${ok} แถว${fail?` (ข้าม ${fail} แถว)`:''}`);
    }
    if(!anyMatched){
      toast('ไม่พบข้อมูลที่นำเข้าได้','ชื่อชีตในไฟล์ต้องตรงกับรหัสแบบฟอร์ม เช่น 01_ER_Daily_Log — ลองดาวน์โหลดเทมเพลตก่อน','err');
    } else {
      toast('นำเข้าข้อมูลสำเร็จ', summary.join(' · ') || 'ไม่มีแถวข้อมูลใหม่');
      if(ROUTE.view==='dashboard') render();
    }
  }catch(e){
    toast('นำเข้าข้อมูลไม่สำเร็จ', e.message, 'err');
  }finally{
    if(importBtn){ importBtn.disabled = false; importBtn.innerHTML = `📤 นำเข้าข้อมูล Excel`; }
  }
}

function bindAdminRegistry(){
  $$('.tab[data-go]').forEach(t=>t.addEventListener('click', ()=>go(t.getAttribute('data-go'))));
  const catSel = $('#regCat'), searchEl = $('#regSearch');
  function paint(){
    const cat = catSel.value, q = (searchEl.value||'').toLowerCase();
    const rows = MASTER_KPI_REGISTRY.filter(r=>{
      if(cat && r.category!==cat) return false;
      if(q && !(r.indicator.toLowerCase().includes(q) || r.definition.toLowerCase().includes(q))) return false;
      return true;
    });
    let html = `<div class="table-wrap scrollx"><table><thead><tr>
      <th>#</th><th>ตัวชี้วัด</th><th>นิยาม/เป้าหมาย</th><th>ความถี่</th><th>แหล่งข้อมูล</th><th>สธ.</th><th>เขต 8</th><th>สสจ.</th><th>ภายใน</th><th>HA</th>
    </tr></thead><tbody>`;
    rows.forEach(r=>{
      html += `<tr><td class="mono">${r.no}</td><td>${esc(r.indicator)}</td><td>${esc(r.definition)||'-'}</td><td>${esc(r.frequency)}</td><td>${esc(r.source)}</td>
        <td>${r.moph?'✓':''}</td><td>${r.region8?'✓':''}</td><td>${r.province?'✓':''}</td><td>${r.internal?'✓':''}</td><td>${r.ha?'✓':''}</td></tr>`;
    });
    html += `</tbody></table></div><div style="margin-top:10px;font-size:12px;color:var(--ink-soft);">${rows.length} / 232 รายการ</div>`;
    $('#regBody').innerHTML = html;
  }
  catSel.addEventListener('change', paint);
  searchEl.addEventListener('input', debounce(paint,150));
  paint();
}
